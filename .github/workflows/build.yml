name: Build desktop apps
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: PepelDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pepel-${{ matrix.os }}
          path: |
            PepelDesktop/dist/*.exe
            PepelDesktop/dist/*.dmg
            PepelDesktop/dist/*.AppImage
